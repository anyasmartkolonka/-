<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Аня - Умный Робот</title>
    <style>
        body { margin: 0; padding: 0; background-color: #121212; color: white; font-family: 'Segoe UI', sans-serif; display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; overflow: hidden; user-select: none; }
        .top-bar { position: absolute; top: 20px; right: 20px; display: flex; gap: 10px; }
        select, .fs-btn { background: #333; color: white; border: none; padding: 8px 15px; border-radius: 10px; cursor: pointer; }
        
        .main-screen { display: flex; flex-direction: column; align-items: center; gap: 15px; width: 90%; max-width: 600px; }
        
        /* === ЛИЦО (ГЛАЗА И РОТ) === */
        .face-container { display: flex; flex-direction: column; align-items: center; margin-bottom: 10px; }
        .eyes { display: flex; gap: 60px; height: 100px; align-items: center; }
        .eye { 
            width: 80px; height: 80px; background-color: #00e5ff; 
            border-radius: 50%; position: relative; box-shadow: 0 0 30px #00e5ff; 
            transition: all 0.2s ease; overflow: hidden;
        }
        .eye::after { /* Зрачок */
            content: ''; width: 30px; height: 30px; background-color: #000; 
            border-radius: 50%; position: absolute; top: 50%; left: 50%; 
            transform: translate(-50%, -50%);
        }
        /* Рот */
        .mouth {
            width: 40px; height: 10px; background-color: #00e5ff;
            border-radius: 10px; margin-top: 15px; box-shadow: 0 0 20px #00e5ff;
            transition: all 0.2s ease;
        }

        /* Анимации состояний */
        .eye.sleeping { height: 10px; border-radius: 10px; box-shadow: none; background-color: #555; }
        .eye.sleeping::after { display: none; }
        .eye.blinking { transform: scaleY(0.1); }
        .eye.listening { background-color: #00ff00; box-shadow: 0 0 40px #00ff00; }
        .eye.thinking { background-color: #ffaa00; box-shadow: 0 0 40px #ffaa00; animation: pulse 0.5s infinite alternate; }
        .eye.speaking { background-color: #d500f9; box-shadow: 0 0 40px #d500f9; }
        
        .mouth.speaking { background-color: #d500f9; box-shadow: 0 0 30px #d500f9; height: 30px; width: 50px; animation: talk 0.2s infinite alternate; }
        .mouth.sleeping { display: none; }

        @keyframes pulse { 0% { transform: scale(1); } 100% { transform: scale(1.1); } }
        @keyframes talk { 0% { height: 10px; } 100% { height: 30px; } }

        /* Zzz для сна */
        .zzz { position: absolute; top: 10px; right: 30%; font-size: 2rem; color: #555; font-weight: bold; opacity: 0; transition: 0.5s; }
        .zzz.show { opacity: 1; animation: floatZ 2s infinite; }
        @keyframes floatZ { 0% { transform: translateY(0); opacity: 1; } 100% { transform: translateY(-30px); opacity: 0; } }

        .clock { font-size: 4rem; font-weight: bold; margin-bottom: -10px; }
        .status { font-size: 1.2rem; color: #4CAF50; text-align: center; height: 30px; }
        
        /* Кнопки управления */
        .controls { display: flex; gap: 15px; margin: 10px 0; }
        .action-btn { background: #333; border: none; color: white; padding: 10px 20px; border-radius: 20px; cursor: pointer; font-size: 1.2rem;}
        .action-btn:active { background: #555; }
        .mic-btn { background: #2c3e50; border: 4px solid #34495e; color: white; width: 80px; height: 80px; border-radius: 50%; font-size: 2rem; cursor: pointer; margin: 10px 0; display: flex; align-items: center; justify-content: center;}
        
        .chat-box { background: #1e1e1e; padding: 15px; border-radius: 15px; width: 100%; min-height: 80px; text-align: center; font-size: 1.1rem; color: #eee; margin-bottom: 10px; overflow-y: auto; max-height: 100px;}
    </style>
</head>
<body>

    <div class="top-bar">
        <select id="voice-select"><option value="">Загрузка голосов...</option></select>
        <button class="fs-btn" onclick="toggleFullScreen()">⛶</button>
    </div>

    <div class="main-screen">
        <div class="face-container">
            <div class="zzz" id="zzz">Z z z</div>
            <div class="eyes">
                <div class="eye" id="eye-left"></div>
                <div class="eye" id="eye-right"></div>
            </div>
            <div class="mouth" id="mouth"></div>
        </div>

        <div class="clock" id="clock">00:00</div>
        <div class="status" id="status">Нажми на микрофон</div>
        <div class="chat-box" id="ai-response">Привет! Я Аня. Нажми на микрофон и скажи что-нибудь.</div>
        
        <div class="controls">
            <button class="action-btn" onclick="toggleSleep()" id="sleep-btn">💤 Спать</button>
            <button class="action-btn" onclick="eat()">🍎 Покушать</button>
        </div>

        <div class="mic-btn" onclick="startListening()">🎤</div>
    </div>

    <script>
        // ВСТАВЬ СВОЙ КЛЮЧ
        const OPENROUTER_API_KEY = "ВСТАВЬ_СЮДА_СВОЙ_КЛЮЧ";
        
        const eyeLeft = document.getElementById('eye-left');
        const eyeRight = document.getElementById('eye-right');
        const mouth = document.getElementById('mouth');
        const zzz = document.getElementById('zzz');
        const statusText = document.getElementById('status');
        
        let isSleeping = false;

        // 1. Часы
        function updateClock() {
            if(isSleeping) return;
            const now = new Date();
            document.getElementById('clock').textContent = String(now.getHours()).padStart(2, '0') + ':' + String(now.getMinutes()).padStart(2, '0');
        }
        setInterval(updateClock, 1000); updateClock();

        // 2. Рандомное моргание
        setInterval(() => {
            if(isSleeping) return;
            eyeLeft.classList.add('blinking');
            eyeRight.classList.add('blinking');
            setTimeout(() => {
                eyeLeft.classList.remove('blinking');
                eyeRight.classList.remove('blinking');
            }, 150);
        }, Math.random() * 3000 + 3000); // Моргает каждые 3-6 секунд

        // 3. Смена состояний лица
        function setFace(state) {
            if (isSleeping && state !== 'sleeping') return; // Если спит, не реагирует
            
            eyeLeft.className = 'eye'; eyeRight.className = 'eye'; mouth.className = 'mouth';
            if (state === 'blinking') return; // Игнорируем, если это просто моргание
            
            if (state) {
                eyeLeft.classList.add(state);
                eyeRight.classList.add(state);
                if (state === 'speaking') mouth.classList.add(state);
            }
        }

        // 4. Сон и Еда
        function toggleSleep() {
            isSleeping = !isSleeping;
            if (isSleeping) {
                setFace('sleeping');
                zzz.classList.add('show');
                document.getElementById('sleep-btn').textContent = "⏰ Проснуться";
                statusText.textContent = "Спит...";
                if(synth.speaking) synth.cancel();
            } else {
                eyeLeft.className = 'eye'; eyeRight.className = 'eye'; mouth.className = 'mouth';
                zzz.classList.remove('show');
                document.getElementById('sleep-btn').textContent = "💤 Спать";
                statusText.textContent = "Нажми на микрофон";
            }
        }

        function eat() {
            if (isSleeping) return;
            setFace('thinking'); // Желтый цвет, пока жует
            statusText.textContent = "Ням-ням...";
            setTimeout(() => { setFace(''); statusText.textContent = "Вкусно!"; }, 2000);
        }

        // 5. Голос
        const synth = window.speechSynthesis;
        const voiceSelect = document.getElementById('voice-select');
        let voices = [];
        function loadVoices() {
            voices = synth.getVoices();
            voiceSelect.innerHTML = '';
            voices.forEach((voice, i) => {
                if (voice.lang.includes('ru')) voiceSelect.appendChild(new Option(`${voice.name}`, i));
            });
        }
        synth.onvoiceschanged = loadVoices; loadVoices();

        function speak(text) {
            if(synth.speaking) synth.cancel();
            setFace('speaking');
            const utterance = new SpeechSynthesisUtterance(text);
            if (voiceSelect.value !== "") utterance.voice = voices[voiceSelect.value];
            utterance.lang = 'ru-RU';
            utterance.onend = () => { setFace(''); statusText.textContent = "Нажми на микрофон"; };
            synth.speak(utterance);
        }

        // 6. Микрофон (Только по кнопке!)
        const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
        let recognition = null;

        if (SpeechRecognition) {
            recognition = new SpeechRecognition();
            recognition.lang = 'ru-RU'; 
            recognition.interimResults = false;
            
            recognition.onstart = () => {
                setFace('listening');
                statusText.textContent = "Слушаю...";
            };
            
            recognition.onresult = (event) => {
                const text = event.results[0][0].transcript;
                document.getElementById('ai-response').textContent = "Вы: " + text;
                processCommand(text.toLowerCase());
            };
            
            recognition.onend = () => { if(!synth.speaking) setFace(''); };
            recognition.onerror = () => { setFace(''); statusText.textContent = "Ошибка микрофона. Нажми еще раз."; };
        }

        function startListening() {
            if(isSleeping) { 
                document.getElementById('ai-response').textContent = "Аня спит. Разбуди её кнопкой 💤.";
                return; 
            }
            if(synth.speaking) synth.cancel();
            recognition.start();
        }

        // 7. Логика ИИ
        async function processCommand(text) {
            if (text.includes('свет') || text.includes('лампа')) { reply("Я пока не умею включать свет без MacroDroid."); return; }
            if (text.includes('телевизор') || text.includes('тв')) { reply("Телевизором я займусь позже!"); return; }

            setFace('thinking');
            statusText.textContent = "Думаю...";
            
            try {
                const response = await fetch('https://openrouter.ai/api/v1/chat/completions', {
                    method: 'POST',
                    headers: { 'Authorization': `Bearer ${OPENROUTER_API_KEY}`, 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        model: "meta-llama/llama-3.1-8b-instruct:free",
                        messages: [
                            { role: "system", content: "Ты — Аня, умный робот-колонка. Отвечай кратко, по-дружески, с юмором. Без списков и сложного форматирования." },
                            { role: "user", content: text }
                        ]
                    })
                });
                const data = await response.json();
                if (data.choices) reply(data.choices[0].message.content);
                else reply("Ошибка ИИ. Ключ верный?");
            } catch (e) { reply("Ошибка сети."); }
        }

        function reply(text) {
            document.getElementById('ai-response').textContent = text;
            speak(text);
        }

        function toggleFullScreen() {
            if (!document.fullscreenElement) document.documentElement.requestFullscreen();
            else document.exitFullscreen();
        }
    </script>
</body>
</html>
