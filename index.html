<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Аня - Чистый ИИ</title>
    <style>
        body { margin: 0; padding: 0; background-color: #121212; color: white; font-family: 'Segoe UI', sans-serif; display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; overflow: hidden; user-select: none; }
        .top-bar { position: absolute; top: 20px; right: 20px; display: flex; gap: 10px; }
        select, .fs-btn { background: #333; color: white; border: none; padding: 8px 15px; border-radius: 10px; cursor: pointer; }
        
        .main-screen { display: flex; flex-direction: column; align-items: center; gap: 15px; width: 90%; max-width: 600px; }
        
        /* === ГЛАЗА === */
        .face { display: flex; gap: 60px; margin-bottom: 10px; height: 100px; align-items: center; }
        .eye { width: 80px; height: 80px; background-color: #00e5ff; border-radius: 50%; position: relative; box-shadow: 0 0 30px #00e5ff; transition: 0.3s; animation: blinkAnim 5s infinite; }
        .pupil { width: 30px; height: 30px; background-color: #000; border-radius: 50%; position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); }
        @keyframes blinkAnim { 0%, 96%, 98% { transform: scaleY(1); } 97% { transform: scaleY(0.1); } }
        
        /* Состояния глаз */
        .eye.listening { background-color: #00ff00; box-shadow: 0 0 40px #00ff00; animation: none; transform: scaleY(1); } /* Зеленый */
        .eye.thinking { background-color: #ffaa00; box-shadow: 0 0 40px #ffaa00; animation: pulseEye 0.5s infinite alternate; } /* Желтый */
        .eye.speaking { background-color: #d500f9; box-shadow: 0 0 40px #d500f9; animation: pulseEye 0.5s infinite alternate; } /* Фиолетовый */
        @keyframes pulseEye { 0% { transform: scale(1); } 100% { transform: scale(1.1); } }

        .clock { font-size: 4rem; font-weight: bold; margin-bottom: -10px; }
        .status { font-size: 1.2rem; color: #4CAF50; text-align: center; }
        .mic-btn { width: 100px; height: 100px; border-radius: 50%; background: #2c3e50; display: flex; align-items: center; justify-content: center; font-size: 2.5rem; cursor: pointer; border: 4px solid #34495e; margin: 10px 0;}
        .chat-box { background: #1e1e1e; padding: 15px; border-radius: 15px; width: 100%; min-height: 80px; text-align: center; font-size: 1.1rem; color: #eee; margin-bottom: 20px; overflow-y: auto; max-height: 120px;}
        .smart-home { display: flex; gap: 10px; width: 100%; justify-content: space-between; }
        .device { background: #1e1e1e; border-radius: 15px; padding: 15px; text-align: center; flex: 1; cursor: pointer; opacity: 0.5; }
    </style>
</head>
<body>

    <div class="top-bar">
        <select id="voice-select"><option value="">Загрузка голосов...</option></select>
        <button class="fs-btn" onclick="toggleFullScreen()">⛶</button>
    </div>

    <div class="main-screen">
        <div class="face">
            <div class="eye" id="eye-left"><div class="pupil"></div></div>
            <div class="eye" id="eye-right"><div class="pupil"></div></div>
        </div>
        <div class="clock" id="clock">00:00</div>
        <div class="status" id="status">Скажи "Аня"</div>
        <div class="chat-box" id="ai-response">Привет! Я Аня. Скажи мое имя и задай вопрос.</div>
        <div class="mic-btn" onclick="toggleListening()">🎤</div>
        
        <!-- Кнопки теперь неактивны (без MacroDroid) -->
        <div class="smart-home">
            <div class="device" onclick="alert('Для света нужен MacroDroid')">💡 Свет</div>
            <div class="device" onclick="alert('Для ТВ нужен MacroDroid')">📺 Телевизор</div>
        </div>
    </div>

    <script>
        // ==========================================
        // ВСТАВЬ СЮДА СВОЙ КЛЮЧ (sk-or-v1-73110...)
        // ==========================================
        const OPENROUTER_API_KEY = "ВСТАВЬ_СЮДА_СВОЙ_КЛЮЧ";
        
        const eyeLeft = document.getElementById('eye-left');
        const eyeRight = document.getElementById('eye-right');
        function setEyes(state) {
            eyeLeft.className = 'eye'; eyeRight.className = 'eye';
            if (state) { eyeLeft.classList.add(state); eyeRight.classList.add(state); }
        }

        function updateClock() {
            const now = new Date();
            document.getElementById('clock').textContent = String(now.getHours()).padStart(2, '0') + ':' + String(now.getMinutes()).padStart(2, '0');
        }
        setInterval(updateClock, 1000); updateClock();

        const synth = window.speechSynthesis;
        const voiceSelect = document.getElementById('voice-select');
        let voices = [];
        function loadVoices() {
            voices = synth.getVoices();
            voiceSelect.innerHTML = '';
            voices.forEach((voice, i) => {
                if (voice.lang.includes('ru')) voiceSelect.appendChild(new Option(`${voice.name}`, i));
            });
        }
        synth.onvoiceschanged = loadVoices; loadVoices();

        function speak(text) {
            if(synth.speaking) synth.cancel();
            setEyes('speaking');
            const utterance = new SpeechSynthesisUtterance(text);
            if (voiceSelect.value !== "") utterance.voice = voices[voiceSelect.value];
            utterance.lang = 'ru-RU';
            utterance.onend = () => { setEyes(''); };
            synth.speak(utterance);
        }

        const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
        let recognition = null;
        let isListening = false;

        if (SpeechRecognition) {
            recognition = new SpeechRecognition();
            recognition.lang = 'ru-RU'; 
            recognition.continuous = true;
            
            recognition.onresult = (event) => {
                const text = event.results[event.results.length - 1][0].transcript.toLowerCase();
                const wakeWords = ['аня', 'анечка', 'аню', 'ань', 'анюша'];
                
                if (wakeWords.some(word => text.includes(word))) {
                    setEyes('listening');
                    document.getElementById('status').textContent = "Слушаю...";
                    
                    let cleanText = text;
                    wakeWords.forEach(word => cleanText = cleanText.replace(word, ''));
                    cleanText = cleanText.replace(/[,.\s!?]+/g, ' ').trim();
                    
                    if (cleanText.length < 3) reply("Да, я здесь.");
                    else processCommand(cleanText);
                }
            };
            recognition.onend = () => { if (isListening) recognition.start(); };
            recognition.start(); 
            isListening = true;
        } else {
            document.getElementById('status').textContent = "Нужен браузер Chrome!";
        }

        function toggleListening() {
            if (isListening) { recognition.stop(); isListening = false; document.getElementById('status').textContent = "Микрофон выключен"; }
            else { recognition.start(); isListening = true; document.getElementById('status').textContent = "Скажи 'Аня'"; }
        }

        async function processCommand(text) {
            document.getElementById('ai-response').textContent = "Вы: " + text;
            setEyes('thinking');
            
            try {
                const response = await fetch('https://openrouter.ai/api/v1/chat/completions', {
                    method: 'POST',
                    headers: { 
                        'Authorization': `Bearer ${OPENROUTER_API_KEY}`, 
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        model: "meta-llama/llama-3.1-8b-instruct:free",
                        messages: [
                            { role: "system", content: "Ты — Аня, умная голосовая колонка. Отвечай кратко, по-дружески, с юмором. Без списков и сложного форматирования." },
                            { role: "user", content: text }
                        ]
                    })
                });
                const data = await response.json();
                
                if (data.choices && data.choices[0].message.content) {
                    reply(data.choices[0].message.content);
                } else {
                    console.error(data);
                    reply("Ошибка ИИ. Возможно, ключ неверный или модель перегружена.");
                }
            } catch (e) { 
                console.error(e); 
                reply("Ошибка сети. Проверь интернет."); 
            }
        }

        function reply(text) {
            document.getElementById('ai-response').textContent = text;
            document.getElementById('status').textContent = "Скажи 'Аня'";
            speak(text);
        }

        function toggleFullScreen() {
            if (!document.fullscreenElement) document.documentElement.requestFullscreen();
            else document.exitFullscreen();
        }
    </script>
</body>
</html>
